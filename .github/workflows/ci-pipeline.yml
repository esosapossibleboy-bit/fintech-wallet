name: Zero-Trust MERN Wallet CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  audit-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Setup Node.js Environments
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: './backend/package.json'

    - name: Install Backend Security Dependencies
      run: |
        cd backend
        npm ci

    - name: Execute Zero-Trust Security Verification
      run: |
        cd backend
        npm run test:security
